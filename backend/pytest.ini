[pytest]
testpaths = tests
# Windows can deny access to the default %TEMP%\pytest-of-<user> folder; keep test files local.
addopts = -p no:cacheprovider --basetemp=.pytest-tmp -m "not live"
markers =
    live: needs a running Ollama with the configured models (run with: pytest -m live)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
